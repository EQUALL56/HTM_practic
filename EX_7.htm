<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Form / input etc</title>
</head>
<body>

    <h1>Form/input etc</h1>

    <h3>simple imput</h3>
    <form>
        <input type="text">
    </form>

    <h3>main types of forms</h3>
    <form>
        <label >Name:</label><br>
        <input type="text"  placeholder="First name"><br><br>

        <label >Age:</label><br>
        <input type="number" >

        <label>Gender:</label><br>
        <input type="radio" ">
        <label >female</label>
        <input type="radio" >
        <label >male</label><br>
        <input type="submit" ><br><br>

        <label >Value:</label><br>
        <input type="range" >
        <input type="submit" ><br><br>

        <label for="email">Email:</label><br>
        <input type="email"><br>
        <input type="submit" ><br><br>

        <label>Checkbox:</label><br>
        <input type="checkbox" >
        <label >I accept the terms</label><br><br>

        <label >Car:</label><br>
        <select>
            <option ></option>
            <option>GEELY</option>
            <option >Subaru</option>
            <option >BELGEE</option>
            <option >MITSUBISI</option>
        </select><br><br>

        <label >Color:</label><br>
        <input type="color" ><br><br>

        <label >Password:</label>
        <input type="password" id="password"><br><br>

        <label >Date:</label><br>
        <input type="date" ><br><br>

        <label >Message:</label><br>
        <textarea  rows="6" cols="30" placeholder="type your message"></textarea><br><br>

        <fieldset style="width: 300px;">
            <legend>Contact</legend>

            <label >Name</label><br>
            <input type="text" ><br><br>

            <label >E-mail</label><br>
            <input type="email" ><br><br>

            <label >Phonenumber</label><br>
            <input type="tel">
        </fieldset><br>

        <input type="submit" >
        <input type="reset" >
        <input type="button" >
    </form>

</body>
</html>
